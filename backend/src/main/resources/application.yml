server:
  port: 8080

spring:
  application:
    name: careerlink
  profiles:
    active: mysql # default profile runs H2 in-memory database
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Configuration for Default Profile (H2 In-Memory)
  datasource:
    url: jdbc:h2:mem:careerlinkdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: root
    password: Pass@123
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Monitoring endpoints configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# JWT Config
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 24 hours in milliseconds

# Mail Configuration (Example)
spring.mail.host: smtp.gmail.com
spring.mail.port: 587
spring.mail.username: careerlink.demo@gmail.com
spring.mail.password: sample-password
spring.mail.properties.mail.smtp.auth: true
spring.mail.properties.mail.smtp.starttls.enable: true

---
# MySQL Profile configuration
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    # Changed localhost to 127.0.0.1 to avoid macOS loopback bugs
    url: jdbc:mysql://127.0.0.1:3306/careerlink?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root                  # <--- Changed to default native user
    password: Honeyn!t!@123    # <--- REPLACE THIS with your actual native MySQL root password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect # <--- Fixed from MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: true
